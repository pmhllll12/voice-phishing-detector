# =============================================================================
# grafana.yaml
#
# 관측성 대시보드(운영자용). grafana/provisioning/{datasources,dashboards}의 각
# yml 파일을 kustomization.yaml의 configMapGenerator가 그대로 읽어 두 개의
# ConfigMap(grafana-datasources, grafana-dashboards-provisioning)으로 만들고,
# docker-compose 때와 같은 디렉터리 구조(/etc/grafana/provisioning/{datasources,
# dashboards})로 마운트한다. 데이터(/var/lib/grafana)는 PVC로 퍼시스턴스를 갖는다
# (docker-compose의 grafana_data named volume과 동일한 역할).
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: vps-env, key: GRAFANA_ADMIN_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
