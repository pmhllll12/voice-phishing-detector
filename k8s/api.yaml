# =============================================================================
# api.yaml
#
# 탐지 오케스트레이션(F-01~F-02, F-05, N-05) — 통화/문자 텍스트(또는 stt-worker를
# 거친 오디오)를 받아 위험도 스코어링을 실행하고 mcp-server/stt-worker 호출 결과를
# 조합한다. NodePort로 8000을 그대로 열어 기존 README의 http://localhost:8000 URL이
# 그대로 유지되게 한다.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: vps-detector/api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: vps-env, key: DATABASE_URL }
            - name: MCP_SERVER_URL
              value: "http://mcp-server:8100"
            - name: STT_WORKER_URL
              value: "http://stt-worker:8300"
            - name: API_KEYS
              valueFrom:
                secretKeyRef: { name: vps-env, key: API_KEYS }
            - name: MCP_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: vps-env, key: MCP_SERVICE_API_KEY }
            - name: MCP_ANALYZE_TIMEOUT_SECONDS
              valueFrom:
                secretKeyRef: { name: vps-env, key: MCP_ANALYZE_TIMEOUT_SECONDS }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
