# =============================================================================
# docker-compose.yaml — 뼈대 (skeleton)
#
# 이 파일은 서비스 구성의 "형태"만 잡아둔 초안입니다. 포트/이미지/헬스체크 등은
# gpu-fleet-ops에서 검증한 패턴을 재사용했지만, 아래 TODO 항목들은 직접 채워야
# 실제로 `docker compose up`이 정상 동작합니다. (환경변수 값, 볼륨 마운트 세부사항,
# 리소스 제한, 네트워크 정책 등은 의도적으로 비워뒀습니다 — 포트폴리오 어필 포인트)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # api: 탐지 오케스트레이션 (F-01~F-02, F-05, N-05 담당)
  #   - 통화/문자 텍스트를 받아 위험도 스코어링 파이프라인을 실행
  #   - mcp-server, rag-worker를 호출해 결과를 조합
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # TODO: .env 파일로 분리하고 docker-compose에는 ${VAR} 형태로만 참조하기
      - DATABASE_URL=postgresql://TODO:TODO@postgres:5432/vps_detector
      - REDIS_URL=redis://redis:6379/0
      - MCP_SERVER_URL=http://mcp-server:8100
      - RAG_WORKER_URL=http://rag-worker:8200
    depends_on:
      - postgres
      - redis
      - mcp-server
    # TODO: healthcheck 추가 (예: curl -f http://localhost:8000/health)
    # TODO: volumes로 개발 중 hot-reload 마운트 여부 결정

  # ---------------------------------------------------------------------------
  # mcp-server: 도구 분리 계층 (F-01, F-04, F-07)
  #   - 통화분석 / 사기패턴DB조회 / 신고연동 툴을 MCP 프로토콜로 노출
  #   - Claude Code에서 .mcp.json을 통해 직접 붙여서 테스트 가능
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./apps/mcp-server
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - DATABASE_URL=postgresql://TODO:TODO@postgres:5432/vps_detector
    depends_on:
      - postgres
    # TODO: MCP transport 방식 결정 (stdio vs SSE vs streamable-http) 후
    #       실행 커맨드/포트 정합성 맞추기

  # ---------------------------------------------------------------------------
  # rag-worker: 유사 사기사례 매칭 (F-04, F-05, N-04)
  #   - pgvector에 사기사례 임베딩을 저장/검색
  #   - 판정 근거(설명가능성)를 위한 근거 문서 리턴
  # ---------------------------------------------------------------------------
  rag-worker:
    build:
      context: ./apps/rag-worker
      dockerfile: Dockerfile
    ports:
      - "8200:8200"
    environment:
      - DATABASE_URL=postgresql://TODO:TODO@postgres:5432/vps_detector
      # TODO: 임베딩 모델/API 키 설정 (로컬 임베딩 모델 vs 외부 API)
    depends_on:
      - postgres

  # ---------------------------------------------------------------------------
  # postgres: 판정 로그(N-01 감사증적) + pgvector(F-04 RAG) 겸용
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      # TODO: 운영/개발 환경변수 분리, secrets 관리 방식 결정
      - POSTGRES_USER=TODO
      - POSTGRES_PASSWORD=TODO
      - POSTGRES_DB=vps_detector
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # TODO: 초기 스키마/마이그레이션 스크립트 마운트 (예: ./infra/db/init.sql)

  # ---------------------------------------------------------------------------
  # redis: 세션/캐시/큐 용도 (예: 신고 알림 큐, rate limiting 등)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # TODO: 영속성 필요 여부 결정 (AOF/RDB) 및 volume 추가

  # ---------------------------------------------------------------------------
  # frontend: 관제 대시보드 (F-06)
  #   - 탐지 현황 / 위험도 분포 / 처리 통계를 시각화하는 자체 프로덕트 화면
  #   - Grafana(아래)와는 별개로, "제품 기능"으로서의 대시보드
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # prometheus: 애플리케이션 메트릭 수집
  #   gpu-fleet-ops에서는 GPU 메트릭을 수집했지만, 이번에는 관측 대상을
  #   애플리케이션 메트릭(vps_*)으로 교체.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # TODO: alerting rule 파일 마운트 (gpu-fleet-ops의 alerting/ 참고)
    # TODO: --storage.tsdb.retention.time 등 커맨드 옵션 결정

  # ---------------------------------------------------------------------------
  # grafana: 관측성 대시보드 (운영자용 — 인프라/애플리케이션 상태 모니터링)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      # TODO: admin 비밀번호 등 secrets 분리
      - GF_SECURITY_ADMIN_PASSWORD=TODO
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # TODO: gpu-fleet-ops의 dashboards/ 폴더 패턴 참고해서
      #       dashboards/ 폴더 만들고 provisioning/dashboards에 연결
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:

# TODO: networks 명시적으로 분리할지 결정 (예: backend망 / observability망)
# TODO: EC2 배포용 docker-compose.prod.yaml 분리 (gpu-fleet-ops 배포 경험 재사용)
