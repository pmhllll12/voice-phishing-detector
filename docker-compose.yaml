# =============================================================================
# docker-compose.yaml
#
# 로컬에서 `docker compose up --build`로 전체 스택(api/mcp-server/rag-worker/
# stt-worker/frontend/postgres/prometheus/grafana)이 실제로 기동되는 구성이다.
# 값은 전부 ${VAR:-기본값} 형태로 빼서, .env.example을 복사해 .env로 만들고
# 오버라이드하면 된다 — .env가 없어도 기본값만으로 로컬 실행은 그대로 된다.
# (환경변수 기본값은 각 앱의 코드 기본값과 동일한 로컬 개발 전용 값이다.
# 프로덕션 배포 시에는 .env로 반드시 교체할 것 — EC2 배포는 별도 이터레이션.)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # api: 탐지 오케스트레이션 (F-01~F-02, F-05, N-05 담당)
  #   - 통화/문자 텍스트(또는 stt-worker를 거친 오디오)를 받아 위험도 스코어링 실행
  #   - mcp-server, stt-worker를 호출해 결과를 조합
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://vps_app:vps_dev_password@postgres:5432/vps_detector}
      - MCP_SERVER_URL=http://mcp-server:8100
      - STT_WORKER_URL=http://stt-worker:8300
      # N-02: 조회/처리/관리자 API 키. 프로덕션에서는 .env로 반드시 실제 발급 키로 교체.
      - API_KEYS=${API_KEYS:-dev-viewer-key:viewer,dev-handler-key:handler,dev-admin-key:admin}
      # N-02: mcp-server 호출용 서비스 자격증명 — mcp-server의 API_KEYS(아래)에 등록된
      # handler 키와 동일해야 한다.
      - MCP_SERVICE_API_KEY=${MCP_SERVICE_API_KEY:-dev-handler-key}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      stt-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # TODO: volumes로 개발 중 hot-reload 마운트 여부 결정
    # TODO: 멀티스테이지 빌드 + non-root user (apps/api/Dockerfile 상단 주석 참고)

  # ---------------------------------------------------------------------------
  # mcp-server: 도구 분리 계층 (F-01, F-04, F-07)
  #   - rest_server.py(REST 어댑터)를 띄운다 — api가 이 컨테이너를 HTTP로 호출한다.
  #     server.py(MCP stdio 어댑터)는 Claude Code가 로컬에서 직접 붙는 용도라
  #     컨테이너에는 포함하지 않는다(Dockerfile 상단 주석 참고).
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./apps/mcp-server
      dockerfile: Dockerfile
    ports:
      - "${MCP_SERVER_PORT:-8100}:8100"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://vps_app:vps_dev_password@postgres:5432/vps_detector}
      # N-02: api와 의도적으로 동일한 값(api_key_role_auth.py 상단 주석 참고) — api가
      # 서비스 자격증명(MCP_SERVICE_API_KEY, 위 api 서비스 참고)으로 이 중 handler 키를
      # 그대로 쓴다.
      - API_KEYS=${API_KEYS:-dev-viewer-key:viewer,dev-handler-key:handler,dev-admin-key:admin}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    extra_hosts:
      # Ollama는 컨테이너 밖(호스트)에서 별도로 떠 있다고 가정한다 — GPU 패스스루 없이
      # 컨테이너 안에서 Ollama까지 새로 띄우는 건 이번 "로컬 스택 기동" 범위 밖이다.
      # Linux에서는 host.docker.internal이 기본으로 안 잡히므로 명시적으로 매핑한다.
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # rag-worker: 유사 사기사례 매칭 (F-04, F-05, N-04)
  #   - postgres(pgvector)에 사기사례 임베딩을 저장/검색
  #   - 기동 시 scripts/seed_fraud_cases.py로 fraud_cases.json을 upsert한 뒤 API를 띄운다
  #     (case_id가 PK라 재기동해도 안전 — ON CONFLICT DO UPDATE, seed_fraud_cases.py 참고)
  # ---------------------------------------------------------------------------
  rag-worker:
    build:
      context: ./apps/rag-worker
      dockerfile: Dockerfile
    ports:
      - "${RAG_WORKER_PORT:-8200}:8200"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://vps_app:vps_dev_password@postgres:5432/vps_detector}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m scripts.seed_fraud_cases && uvicorn src.main:app --host 0.0.0.0 --port 8200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # stt-worker: 모바일 오디오 실시간 감지용 STT (F-05 오디오 경로)
  #   - faster-whisper로 오디오 청크를 텍스트로 변환, api가 호출한다.
  #   - GPU 패스스루 없이도 자동으로 CPU 폴백한다(faster_whisper_adapter.py 참고).
  # ---------------------------------------------------------------------------
  stt-worker:
    build:
      context: ./apps/stt-worker
      dockerfile: Dockerfile
    ports:
      - "${STT_WORKER_PORT:-8300}:8300"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8300/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # postgres: 판정 로그(N-01 감사증적, api/mcp-server) + pgvector(F-04 RAG) 겸용.
  # 초기 스키마는 infra/db/init.sql — call_analysis_results/report_records 테이블과
  # append-only 강제 트리거, fraud_cases(pgvector) 테이블을 만든다(컨테이너 최초 기동
  # 시 1회 자동 실행, postgres 공식 이미지의 /docker-entrypoint-initdb.d/ 관례).
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-vps_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vps_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-vps_detector}
    volumes:
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vps_app} -d ${POSTGRES_DB:-vps_detector}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # frontend: 관제 대시보드 (F-06)
  #   - 탐지 현황 / 위험도 분포 / 처리 통계를 시각화하는 자체 프로덕트 화면
  #   - Grafana(아래)와는 별개로, "제품 기능"으로서의 대시보드
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # 브라우저(호스트)에서 접속하므로 컨테이너 내부 이름(api:8000)이 아니라 호스트에서
      # api가 노출된 포트를 가리켜야 한다 — NEXT_PUBLIC_*는 빌드/런타임에 브라우저 번들에
      # 그대로 노출된다.
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:${API_PORT:-8000}
      # N-02: 대시보드는 조회(목록/통계)와 처리(분석 실행/신고 접수)를 모두 수행하므로
      # handler 키가 필요하다. NEXT_PUBLIC_*는 "진짜" 비밀키가 아니라 로그인 시스템이
      # 없는 지금 단계의 데모용 타협이다 — 실제 서비스라면 사용자별 세션을 Next.js
      # 서버(BFF)가 들고 api를 대신 호출해야 한다(TODO, 아직 미착수).
      - NEXT_PUBLIC_API_KEY=${API_HANDLER_KEY:-dev-handler-key}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # prometheus: 애플리케이션 메트릭 수집 (api/mcp-server/rag-worker/stt-worker의
  # vps_* 커스텀 메트릭 — prometheus/prometheus.yml 참고)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # TODO: alerting rule 파일 마운트 (gpu-fleet-ops의 alerting/ 참고)
    # TODO: --storage.tsdb.retention.time 등 커맨드 옵션 결정

  # ---------------------------------------------------------------------------
  # grafana: 관측성 대시보드 (운영자용 — 인프라/애플리케이션 상태 모니터링)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-vps_dev_admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # TODO: gpu-fleet-ops의 dashboards/ 폴더 패턴 참고해서
      #       dashboards/ 폴더 만들고 provisioning/dashboards에 연결
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:

# TODO: networks 명시적으로 분리할지 결정 (예: backend망 / observability망)
# TODO: EC2 배포용 docker-compose.prod.yaml 분리 (gpu-fleet-ops 배포 경험 재사용,
#       다음 이터레이션에서 별도로 진행 — 지금은 로컬 기동까지만)
