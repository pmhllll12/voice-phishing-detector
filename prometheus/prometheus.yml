# =============================================================================
# prometheus.yml — 뼈대 (skeleton)
#
# gpu-fleet-ops에서는 GPU 메트릭(온도/사용률/VRAM/전력)을 수집했다면,
# 이번 프로젝트는 "애플리케이션 메트릭"을 수집 대상으로 삼는다.
#
# 아래 커스텀 메트릭들은 apps/api/src/infrastructure/metrics.py 에서
# prometheus_client로 실제 구현해야 값이 채워진다 (지금은 스캐폴딩만 되어있음).
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# TODO: gpu-fleet-ops의 alerting/ 폴더처럼 rule_files 추가
#       (예: 위험도 高 탐지 급증 시 알림, API 응답시간 N-05 SLA 5초 초과 시 알림 등)
# rule_files:
#   - "alerting/*.yml"

scrape_configs:
  # ---------------------------------------------------------------------------
  # api 서비스: 탐지 파이프라인 관련 커스텀 메트릭
  # ---------------------------------------------------------------------------
  - job_name: "vps-api"
    static_configs:
      - targets: ["api:8000"]
    # TODO: api 서비스에 /metrics 엔드포인트 노출 (prometheus_client 미들웨어)
    #
    # 아래는 이번 프로젝트에서 정의하기로 한 커스텀 메트릭 목록 (구현 예정):
    #
    #   vps_calls_analyzed_total
    #     - Counter, label: risk_level(저/중/고)
    #     - F-01/F-02 처리된 통화/문자 건수
    #
    #   vps_risk_score_distribution
    #     - Histogram, buckets: 0~100 구간
    #     - F-02 위험도 스코어 분포
    #
    #   vps_deepvoice_detected_total
    #     - Counter, label: result(synthetic/authentic)
    #     - F-03 딥보이스 판별 결과 집계
    #
    #   vps_analysis_duration_seconds
    #     - Histogram
    #     - N-05 "5초 이내 판정" SLA 검증용 — 이 메트릭으로 SLA 위반 알림 구성 예정
    #
    #   vps_reports_submitted_total
    #     - Counter, label: channel(자동/수동)
    #     - F-07 신고 접수 건수

  # ---------------------------------------------------------------------------
  # mcp-server 서비스
  # ---------------------------------------------------------------------------
  - job_name: "vps-mcp-server"
    static_configs:
      - targets: ["mcp-server:8100"]
    # mcp-server(rest_server.py)가 apps/mcp-server/src/infrastructure/metrics.py에서
    # 노출하는 메트릭 (F-01/F-02 v2, Ollama 로컬 LLM 기반):
    #
    #   vps_mcp_llm_inference_duration_seconds
    #     - Histogram
    #     - LLM 호출 1건(콜드 스타트 로딩 포함) 소요 시간
    #
    #   vps_mcp_llm_analysis_requests_total
    #     - Counter, label: result(success/fallback)
    #     - fallback이 계속 올라가면 Ollama 쪽에 문제가 있다는 신호로 알림에 쓸 수 있음
    #
    #   vps_mcp_llm_gpu_memory_bytes
    #     - Gauge
    #     - Ollama가 GET /api/ps로 보고하는, 로드된 모델의 GPU 메모리 점유량.
    #       rag-worker의 vps_rag_gpu_memory_allocated_bytes와 이 값을 더하면
    #       RTX 3050 한 장을 두 프로세스(임베딩/LLM)가 얼마나 나눠 쓰는지 보임.
    #
    #   vps_mcp_llm_model_load_duration_seconds
    #     - Gauge
    #     - 콜드 스타트 모델 로딩 시간 (캐시 히트면 0에 가까움)
    #
    #   vps_mcp_llm_model_info
    #     - Info, label: model_name, base_url
    #
    # TODO: N-05(응답 5초 이내) SLA와 LLM 콜드 스타트 지연시간이 충돌할 수 있음
    #       (OLLAMA_KEEP_ALIVE로 모델을 계속 warm하게 유지하는 정책 검토 필요).

  # ---------------------------------------------------------------------------
  # rag-worker 서비스
  # ---------------------------------------------------------------------------
  - job_name: "vps-rag-worker"
    static_configs:
      - targets: ["rag-worker:8200"]
    # rag-worker가 apps/rag-worker/src/infrastructure/metrics.py에서 노출하는 메트릭:
    #
    #   vps_rag_embedding_inference_duration_seconds
    #     - Histogram
    #     - F-04 쿼리 1건을 임베딩 벡터로 변환하는 데 걸린 시간 (GPU/CPU 추론 성능 관측)
    #
    #   vps_rag_embedding_search_requests_total
    #     - Counter, label: result(success/error)
    #     - F-04 유사사례 검색 요청 수
    #
    #   vps_rag_gpu_memory_allocated_bytes
    #     - Gauge
    #     - 이 프로세스가 점유 중인 GPU 메모리 (CPU 폴백 중이면 0)
    #
    #   vps_rag_model_load_duration_seconds
    #     - Gauge
    #     - 서버 시작 시 임베딩 모델 로딩에 걸린 시간 (1회성)
    #
    #   vps_rag_embedding_model_info
    #     - Info, label: model_name, device
    #     - 현재 떠 있는 모델/디바이스 구성
    #
    # TODO: 캐시 히트율 — 지금은 요청마다 쿼리를 새로 인코딩하므로 캐시 개념이 없음.
    #       동일 쿼리 반복이 잦아지면 LRU 캐시 도입 검토.

  # ---------------------------------------------------------------------------
  # prometheus 자체 모니터링 (기본 제공)
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

# TODO: postgres_exporter / redis_exporter 추가 여부 결정 (인프라 레벨 관측)
